name: Feature
about: 새 서버 기능 추가 작업
labels: [feature]
body:
  - type: textarea
    id: goal
    attributes:
      label: 목적
      description: 이 기능이 필요한 이유와 기대 결과를 적어주세요.
    validations:
      required: true
  - type: dropdown
    id: repo_scope
    attributes:
      label: 영향 범위
      options:
        - server only
        - client and server
        - docs only
    validations:
      required: true
  - type: textarea
    id: authority
    attributes:
      label: 서버 검증/판정 책임
      description: 서버가 어떤 값을 검증하고 어떤 상태를 확정해야 하나요?
      placeholder: 예) 공격 거리, 쿨타임, 명중, 피해량, 사망, 보상은 서버가 확정한다.
    validations:
      required: true
  - type: textarea
    id: protocol
    attributes:
      label: 프로토콜 변경 여부
      description: 메시지 타입, snapshot, event 변경이 필요한지 적어주세요.
    validations:
      required: true
  - type: textarea
    id: storage
    attributes:
      label: Storage / D1 변경 여부
      description: key, version, migration, 기존 데이터 호환성 영향을 적어주세요.
  - type: textarea
    id: files
    attributes:
      label: 예상 수정 파일
      placeholder: src/rooms/GameRoom.ts, src/systems/..., src/protocol/messages.ts, docs/...
  - type: textarea
    id: validation
    attributes:
      label: 검증 방법
      placeholder: npm run check, wrangler dev, 실패 케이스 테스트 등
